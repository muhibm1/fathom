# Fathom's code review of a pull request, on demand only: add the `fathom-review` label,
# or run this workflow by hand with the pull request's number. It posts inline comments
# on new findings and one summary comment updated in place. The label is removed after
# the run, so adding it again asks for a fresh review of the latest push.
# It no longer runs on every push: each run costs Actions minutes and model tokens.
# Model findings need the repository secret FATHOM_ANTHROPIC_API_KEY; without it the review runs
# deterministic checks only.
# Advisory: this job never fails the pull request. Binding checks belong to fathom-gate.
name: fathom-review

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

permissions:
  contents: read
  pull-requests: write
  # Removing the label after the run.
  issues: write

concurrency:
  group: fathom-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # Only the review label starts it (other labels skip at no cost). Fork pull requests get no
    # secrets and a read-only token, so the comment could not be posted.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'fathom-review' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      # The pull request's base, head sha, title and body, read from the API so a manual run has them too.
      # Passed through env and files, never into the script text.
      - name: Read the pull request
        id: pr
        run: |
          gh api "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          if [ "$(jq -r .head.repo.full_name "$RUNNER_TEMP/pr.json")" != "$REPO" ]; then
            echo "::error::Fork pull requests cannot be reviewed here."; exit 1
          fi
          echo "base=$(jq -r .base.ref "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          jq -r '.title + "\n\n" + (.body // "")' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/intent.txt"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: |
          uv venv .venv
          uv pip install -e ".[fixture,syntax]"
      - name: Parse the dbt project
        working-directory: fixture/dbt_project
        env:
          PIPELINEBENCH_DB: warehouse.duckdb
        run: ../../.venv/bin/dbt parse --profiles-dir . -q
      - name: Build the graph
        run: .venv/bin/fathom sync
      # Inline comments on new findings, one summary comment updated in place, and a reply on findings
      # that a later push made go away.
      - name: Review the diff and post it
        continue-on-error: true
        env:
          FATHOM_ANTHROPIC_API_KEY: ${{ secrets.FATHOM_ANTHROPIC_API_KEY }}
          # Dollars one review may spend; a review on Haiku has cost about 5.5 cents.
          FATHOM_API_CAP: "0.25"
          BASE_REF: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          provider=stub
          if [ -n "$FATHOM_ANTHROPIC_API_KEY" ]; then provider=anthropic; fi
          # Haiku keeps a review (four passes and a second reading) to a few cents; drop --model for the configured default.
          .venv/bin/fathom review --git "origin/$BASE_REF" --provider "$provider" --model claude-haiku-5-5 --format markdown \
            --intent="$(cat "$RUNNER_TEMP/intent.txt")" \
            --post-github "$REPO#$PR" --head-sha "$HEAD_SHA" \
            || echo "::error::Fathom review did not complete; see this step's log."
          # What this review spent, from the API ledger; nothing when the stub provider ran.
          if [ -f "$HOME/.fathom/api-ledger.jsonl" ]; then .venv/bin/flywheel spend "$HOME/.fathom/api-ledger.jsonl" || true; fi
      - name: Remove the label so it can ask for the next review
        if: always() && github.event_name == 'pull_request'
        run: gh pr edit "$PR" --repo "$REPO" --remove-label fathom-review || true
