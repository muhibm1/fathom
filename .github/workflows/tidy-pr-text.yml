# Removes the generated footer that the cloud tooling appends to pull request descriptions and
# pull request comments ("---" then an italic "Generated by [...](...)" line). Edits made with the
# built-in token do not start workflows again, so this never loops. Run it by hand
# (workflow_dispatch) to clean every existing pull request and comment in the repository.
name: tidy-pr-text

on:
  pull_request:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  tidy:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove the generated footer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > tidy.mjs <<'JS'
          import { readFileSync } from 'node:fs';
          const repo = process.env.GITHUB_REPOSITORY;
          const api = process.env.GITHUB_API_URL;
          const headers = { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' };
          // A final "---" line, then one "Generated by/with [name](link)" line, italic or not, and optionally a bare link.
          const FOOTER = /\s*\n-{3}[ \t]*\n+(?:\S+ )?_?Generated (?:by|with) \[[^\]\n]+\]\([^)\n]+\)_?[ \t]*(?:\n+[ \t]*https?:\/\/\S+[ \t]*)?\s*$/;
          const clean = (text) => (typeof text === 'string' && FOOTER.test(text) ? text.replace(FOOTER, '\n') : null);
          async function call(method, path, body) {
            const r = await fetch(`${api}${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
            if (!r.ok) throw new Error(`${method} ${path}: ${r.status} ${await r.text()}`);
            return r.json();
          }
          async function* pages(path) {
            for (let page = 1; ; page++) {
              const items = await call('GET', `${path}${path.includes('?') ? '&' : '?'}per_page=100&page=${page}`);
              yield* items;
              if (items.length < 100) return;
            }
          }
          let fixed = 0;
          async function fixPull(number, body) {
            const next = clean(body);
            if (next !== null) { await call('PATCH', `/repos/${repo}/pulls/${number}`, { body: next }); fixed++; console.log(`pull request #${number}: footer removed`); }
          }
          async function fixComment(id, body, where) {
            const next = clean(body);
            if (next !== null) { await call('PATCH', `/repos/${repo}/issues/comments/${id}`, { body: next }); fixed++; console.log(`comment on #${where}: footer removed`); }
          }
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const name = process.env.GITHUB_EVENT_NAME;
          if (name === 'pull_request') await fixPull(event.pull_request.number, event.pull_request.body);
          else if (name === 'issue_comment') await fixComment(event.comment.id, event.comment.body, event.issue.number);
          else {
            for await (const p of pages(`/repos/${repo}/pulls?state=all`)) await fixPull(p.number, p.body);
            for await (const c of pages(`/repos/${repo}/issues/comments`)) {
              if (c.html_url.includes('/pull/')) await fixComment(c.id, c.body, c.html_url.split('/pull/')[1].split('#')[0]);
            }
          }
          console.log(`${fixed} footer(s) removed`);
          JS
          node tidy.mjs
