# Orion's code review on every pull request: inline comments on new findings and
# one summary comment updated in place on each push. Model findings need the
# repository secret ORION_ANTHROPIC_API_KEY; without it the review runs
# deterministic checks only.
# Advisory: this job never fails the pull request. Binding checks belong to orion-gate.
name: orion-review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Fork pull requests get no secrets and a read-only token, so the comment could not be posted.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: |
          uv venv .venv
          uv pip install -e ".[fixture,syntax]"
      - name: Parse the dbt project
        working-directory: fixture/dbt_project
        env:
          PIPELINEBENCH_DB: warehouse.duckdb
        run: ../../.venv/bin/dbt parse --profiles-dir . -q
      - name: Build the graph
        run: .venv/bin/orion sync
      # Inline comments on new findings, one summary comment updated in place, and a reply on findings
      # that a push made go away. The head sha is the PR's own commit, not the merge commit the checkout holds.
      - name: Review the diff and post it
        continue-on-error: true
        env:
          ORION_ANTHROPIC_API_KEY: ${{ secrets.ORION_ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          provider=stub
          if [ -n "$ORION_ANTHROPIC_API_KEY" ]; then provider=anthropic; fi
          .venv/bin/orion review --git "origin/$BASE_REF" --provider "$provider" --format markdown \
            --post-github "$REPO#$PR" --head-sha "$HEAD_SHA" \
            || echo "::error::Orion review did not complete; see this step's log."
