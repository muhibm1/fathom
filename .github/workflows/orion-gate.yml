# The adoption wedge: Orion's verdict on every pull request that touches the
# platform, posted as a comment, before anyone lets an agent near the pipeline.
# Make it binding by changing --fail-on to block (or warn).
name: orion-gate

on:
  pull_request:
    paths:
      - "fixture/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: |
          uv venv .venv
          uv pip install -e ".[fixture]"
      - name: Parse the dbt project
        working-directory: fixture/dbt_project
        env:
          PIPELINEBENCH_DB: warehouse.duckdb
        run: ../../.venv/bin/dbt parse --profiles-dir . -q
      - name: Build the graph from the base branch's view of the platform
        run: .venv/bin/orion sync
      - name: Pre-flight the diff
        id: gate
        continue-on-error: true
        run: |
          .venv/bin/orion gate --git "origin/${{ github.base_ref }}" --fail-on block > verdict.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Comment the verdict on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file verdict.md
      - name: Fail the job at the gate's severity
        if: steps.gate.outcome == 'failure'
        run: exit 1
