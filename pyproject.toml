[project]
name = "orion"
version = "0.1.0"
description = "Pre-flight checks for agents touching data pipelines: lineage, SLAs, incident history and locked decisions, surfaced at the moment of change, over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "duckdb>=1.1",
  "sqlglot>=25",
  "typer>=0.12",
  "pyyaml>=6",
  "rich>=13",
  "pydantic>=2",
  "mcp>=2",
]

[project.optional-dependencies]
fixture = ["dbt-core>=1.8", "dbt-duckdb>=1.8"]
dev = ["pytest>=8", "ruff>=0.6"]
bench = []  # kept so `.[bench]` installs still work; the benchmark agent uses Orion's provider
embed = ["sentence-transformers>=3"]
syntax = ["tree-sitter>=0.23", "tree-sitter-language-pack>=1.22"]

[project.scripts]
orion = "orion.cli:app"
pipelinebench = "pipelinebench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orion", "src/pipelinebench"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
