# HELD-OUT recall set for `pipelinebench recall-eval`: real bugs at the commit that introduced them.
# Mined with `pipelinebench mine-introducers` from repositories NOT in the tuning set (recall.yaml), and
# labelled by hand from the upstream git history only (fix commit + introducing commit); no Orion review
# output was looked at. Candidates were taken in mined order; fixes for typos, types, docs, lint, tests,
# refactors and features, bugs that predate the blamed commit, and bugs that need knowledge no reviewer of
# the diff has, were left out. `expect` uses the introducing commit's new-side line numbers.
repos:
  starlette:
    url: https://github.com/encode/starlette
  werkzeug:
    url: https://github.com/pallets/werkzeug
  gin:
    url: https://github.com/gin-gonic/gin
  chi:
    url: https://github.com/go-chi/chi
  echo:
    url: https://github.com/labstack/echo
  ky:
    url: https://github.com/sindresorhus/ky
  h3:
    url: https://github.com/unjs/h3
  express:
    url: https://github.com/expressjs/express
