# Review eval cases. Ground truth is written by hand and never derived from Fathom.
# A case changes one file (`file` plus its fields) or several (`files`, a list of
# the same fields). `before`/`after` give a file; `before_from_repo` reads the
# current file and `edits` rewrites it. `expect` lists the bugs a reviewer must
# raise, each located by a `marker`: a substring of the line in the new file where
# the bug is, plus `file` when the case changes several files; `also` lists other
# `file`/`marker` places where the same bug may fairly be raised. `repo_files` are
# files the change leaves alone but that exist in the repository, for reference
# searches. Cases with `expect: []` are correct changes, used to count false alarms.

- id: py-sql-injection
  file: app/users.py
  before: |
    import sqlite3


    def find_user(con: sqlite3.Connection, email: str):
        return con.execute("select id, name from users where email = ?", (email,)).fetchone()
  after: |
    import sqlite3


    def find_user(con: sqlite3.Connection, email: str):
        email = email.strip().lower()
        return con.execute(f"select id, name from users where email = '{email}'").fetchone()
  expect:
    - marker: "f\"select id, name"
      category: security

- id: py-shell-injection
  file: app/archive.py
  before: |
    import subprocess


    def archive(path: str) -> None:
        subprocess.run(["tar", "czf", path + ".tgz", path], check=True)
  after: |
    import subprocess


    def archive(path: str, level: int = 6) -> None:
        subprocess.run(f"GZIP=-{level} tar czf {path}.tgz {path}", shell=True, check=True)
  expect:
    - marker: "shell=True"
      category: security

- id: py-off-by-one-total
