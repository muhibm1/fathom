- id: hard-py-dedupe-keeps-last-not-first
  file: app/events.py
  before: |
    def dedupe(events: list[dict]) -> list[dict]:
        """Keep the first event seen for each id; later ones are retries and carry stale data."""
        seen: set[str] = set()
        out = []
        for e in events:
            if e["id"] in seen:
                continue
            seen.add(e["id"])
            out.append(e)
        return out
  after: |
    def dedupe(events: list[dict]) -> list[dict]:
        """Keep the first event seen for each id; later ones are retries and carry stale data."""
        by_id = {e["id"]: e for e in events}
        return list(by_id.values())
  expect:
