# Harder cases: the bug, or the reason a change is fine, sits outside the hunk's
# three context lines, so a reviewer that sees only the diff cannot tell.

- id: ctx-swapped-transfer-args
  file: app/ledger.py
  before: |
    from decimal import Decimal


    def transfer(src: str, dst: str, amount: Decimal) -> None:
        """Move ``amount`` from account ``src`` to account ``dst``."""
        debit(src, amount)
        credit(dst, amount)


    def debit(account: str, amount: Decimal) -> None:
        BALANCES[account] -= amount


    def credit(account: str, amount: Decimal) -> None:
        BALANCES[account] += amount


    BALANCES: dict[str, Decimal] = {}


    def settle_refund(order) -> None:
        pass
  after: |
    from decimal import Decimal


    def transfer(src: str, dst: str, amount: Decimal) -> None:
        """Move ``amount`` from account ``src`` to account ``dst``."""
        debit(src, amount)
        credit(dst, amount)


    def debit(account: str, amount: Decimal) -> None:
        BALANCES[account] -= amount


    def credit(account: str, amount: Decimal) -> None:
        BALANCES[account] += amount


    BALANCES: dict[str, Decimal] = {}


    def settle_refund(order) -> None:
        # refund: money goes from the merchant back to the customer
        transfer(order.customer_account, order.merchant_account, order.refund_amount)
  expect:
    - marker: "transfer(order.customer_account, order.merchant_account"
      category: correctness

- id: ctx-units-mismatch
  file: app/shipping.py
  before: |
    SHIPPING_FLAT_DOLLARS = 7.5
    FREE_SHIPPING_OVER_DOLLARS = 50


    def item_total_cents(items) -> int:
        return sum(i.price_cents * i.qty for i in items)


    def order_total_cents(items) -> int:
        return item_total_cents(items)
  after: |
    SHIPPING_FLAT_DOLLARS = 7.5
    FREE_SHIPPING_OVER_DOLLARS = 50


    def item_total_cents(items) -> int:
        return sum(i.price_cents * i.qty for i in items)


    def order_total_cents(items) -> int:
        subtotal = item_total_cents(items)
        if subtotal > FREE_SHIPPING_OVER_DOLLARS:
            return subtotal
        return subtotal + SHIPPING_FLAT_DOLLARS
  expect:
    - marker: "if subtotal > FREE_SHIPPING_OVER_DOLLARS:"
      category: correctness

- id: ctx-lock-bypassed
  file: app/cache.py
  before: |
    import threading


    class Counter:
        def __init__(self):
            self._lock = threading.Lock()
            self._counts: dict[str, int] = {}

        def incr(self, key: str) -> int:
            with self._lock:
                self._counts[key] = self._counts.get(key, 0) + 1
                return self._counts[key]

        def get(self, key: str) -> int:
            with self._lock:
                return self._counts.get(key, 0)
  after: |
    import threading


    class Counter:
        def __init__(self):
            self._lock = threading.Lock()
            self._counts: dict[str, int] = {}

        def incr(self, key: str) -> int:
            with self._lock:
                self._counts[key] = self._counts.get(key, 0) + 1
                return self._counts[key]

        def get(self, key: str) -> int:
            with self._lock:
                return self._counts.get(key, 0)

        def incr_many(self, keys: list[str]) -> None:
            for key in keys:
                self._counts[key] = 1 + self._counts.get(key, 0)
  expect:
    - marker: "self._counts[key] = 1 + self._counts.get(key, 0)"
      category: correctness

- id: ctx-timeout-milliseconds
  file: app/http.py
  before: |
