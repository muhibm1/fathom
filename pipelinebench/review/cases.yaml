- id: clean-ctx-lock-held-by-caller
  file: app/queue.py
  before: |
    import threading


    class Queue:
        """Callers of methods named ``_locked_*`` must hold ``self._lock``."""

        def __init__(self):
            self._lock = threading.Lock()
            self._items: list = []

        def push(self, item) -> None:
            with self._lock:
                self._locked_append(item)

        def _locked_append(self, item) -> None:
            self._items.append(item)
  after: |
    import threading


    class Queue:
        """Callers of methods named ``_locked_*`` must hold ``self._lock``."""

        def __init__(self):
            self._lock = threading.Lock()
            self._items: list = []

        def push(self, item) -> None:
            with self._lock:
                self._locked_append(item)

        def _locked_append(self, item) -> None:
            self._items.append(item)
            if len(self._items) > 1000:
                self._items.pop(0)
  expect: []

- id: clean-ctx-validated-earlier
  file: app/upload.py
  before: |
    import re

    SAFE_NAME = re.compile(r"^[A-Za-z0-9_.-]{1,64}$")


    def save_upload(name: str, data: bytes, root: str) -> str:
        if not SAFE_NAME.match(name) or name.startswith("."):
            raise ValueError("bad file name")
        return _write(root, name, data)


    def _write(root: str, name: str, data: bytes) -> str:
        path = root + "/" + name
        open(path, "wb").write(data)
        return path
  after: |
    import os
    import re

    SAFE_NAME = re.compile(r"^[A-Za-z0-9_.-]{1,64}$")


    def save_upload(name: str, data: bytes, root: str) -> str:
        if not SAFE_NAME.match(name) or name.startswith("."):
            raise ValueError("bad file name")
        return _write(root, name, data)


    def _write(root: str, name: str, data: bytes) -> str:
        path = os.path.join(root, name)
        with open(path, "wb") as f:
            f.write(data)
        return path
  expect: []

# Cross-file changes (`xf-`): the bug is on a changed line in one file, and only
# the change to another file in the same diff shows it is a bug.

- id: xf-py-kwarg-renamed
  files:
    - file: app/http.py
      before: |
        import urllib.request


        def fetch(url: str, timeout: float = 10.0) -> bytes:
            with urllib.request.urlopen(url, timeout=timeout) as r:
                return r.read()
      after: |
        import urllib.request


        def fetch(url: str, *, timeout_s: float = 10.0) -> bytes:
            with urllib.request.urlopen(url, timeout=timeout_s) as r:
                return r.read()
    - file: app/health.py
      before: |
        from app.http import fetch


        def ping(url: str) -> bool:
            return fetch(url) == b"ok"
      after: |
        from app.http import fetch


        def ping(url: str) -> bool:
            return fetch(url) == b"ok"


        def ping_fast(url: str) -> bool:
            return fetch(url, timeout=1.0) == b"ok"
  expect:
    - file: app/health.py
      marker: "fetch(url, timeout=1.0)"
      category: correctness

