- id: py-auth-check-removed
  file: app/api/orders.py
  before: |
    def get_order(request, order_id):
        order = Order.objects.get(id=order_id)
        if order.customer_id != request.user.customer_id:
            raise PermissionDenied()
        return serialize(order)
  after: |
    def get_order(request, order_id):
        order = Order.objects.select_related("items").get(id=order_id)
        return serialize(order)
  expect:
    - marker: "return serialize(order)"
      category: security

- id: ts-xss-innerhtml
  file: web/src/comments.ts
  before: |
    export function renderComment(el: HTMLElement, c: { author: string; body: string }) {
      el.textContent = `${c.author}: ${c.body}`;
