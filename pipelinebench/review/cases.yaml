- id: clean-ctx-lock-held-by-caller
  file: app/queue.py
  before: |
    import threading


    class Queue:
        """Callers of methods named ``_locked_*`` must hold ``self._lock``."""

        def __init__(self):
            self._lock = threading.Lock()
            self._items: list = []

        def push(self, item) -> None:
            with self._lock:
                self._locked_append(item)

        def _locked_append(self, item) -> None:
            self._items.append(item)
  after: |
    import threading


    class Queue:
        """Callers of methods named ``_locked_*`` must hold ``self._lock``."""

        def __init__(self):
            self._lock = threading.Lock()
            self._items: list = []

        def push(self, item) -> None:
            with self._lock:
                self._locked_append(item)

        def _locked_append(self, item) -> None:
            self._items.append(item)
            if len(self._items) > 1000:
                self._items.pop(0)
  expect: []

- id: clean-ctx-validated-earlier
  file: app/upload.py
  before: |
    import re

    SAFE_NAME = re.compile(r"^[A-Za-z0-9_.-]{1,64}$")


    def save_upload(name: str, data: bytes, root: str) -> str:
        if not SAFE_NAME.match(name) or name.startswith("."):
            raise ValueError("bad file name")
        return _write(root, name, data)


    def _write(root: str, name: str, data: bytes) -> str:
        path = root + "/" + name
        open(path, "wb").write(data)
        return path
  after: |
    import os
    import re

    SAFE_NAME = re.compile(r"^[A-Za-z0-9_.-]{1,64}$")


    def save_upload(name: str, data: bytes, root: str) -> str:
        if not SAFE_NAME.match(name) or name.startswith("."):
            raise ValueError("bad file name")
        return _write(root, name, data)


    def _write(root: str, name: str, data: bytes) -> str:
        path = os.path.join(root, name)
        with open(path, "wb") as f:
            f.write(data)
        return path
  expect: []
