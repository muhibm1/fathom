# Correct changes: a good reviewer raises nothing at warn or above.

- id: clean-py-refactor
  file: app/pricing.py
  before: |
    def price_with_tax(price, rate):
        return price + price * rate


    def prices_with_tax(prices, rate):
        out = []
        for p in prices:
            out.append(p + p * rate)
        return out
  after: |
    def price_with_tax(price, rate):
        return price + price * rate


    def prices_with_tax(prices, rate):
        return [price_with_tax(p, rate) for p in prices]
  expect: []

- id: clean-py-docstring-and-types
  file: app/slug.py
  before: |
    import re


    def slugify(text):
        return re.sub(r"[^a-z0-9]+", "-", text.lower()).strip("-")
  after: |
    import re


    def slugify(text: str) -> str:
        """Lowercase ``text`` and join its alphanumeric runs with hyphens."""
        return re.sub(r"[^a-z0-9]+", "-", text.lower()).strip("-")
  expect: []

