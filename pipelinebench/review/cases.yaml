- id: py-swallowed-exception
  file: app/payments.py
  before: |
    def charge(client, customer_id, amount_cents):
        resp = client.charge(customer_id, amount_cents)
        resp.raise_for_status()
        return resp.json()["charge_id"]
  after: |
    def charge(client, customer_id, amount_cents):
        try:
            resp = client.charge(customer_id, amount_cents)
            resp.raise_for_status()
            return resp.json()["charge_id"]
        except Exception:
            return None
  expect:
    - marker: "except Exception:"
      category: correctness

