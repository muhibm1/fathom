- id: hard-xf-py-cache-key-ignores-new-arg
  files:
    - file: app/pricing.py
      before: |
        from app.cache import cached_key, get_cached, set_cached


        def quote(amount_cents: int) -> int:
            key = cached_key("quote", amount_cents)
            hit = get_cached(key)
            if hit is not None:
                return hit
            value = amount_cents + fee(amount_cents)
            set_cached(key, value)
            return value


        def fee(amount_cents: int) -> int:
            return max(30, amount_cents * 29 // 1000)
      after: |
        from app.cache import cached_key, get_cached, set_cached

        FX = {"usd": 1.0, "eur": 1.08, "gbp": 1.27}


        def quote(amount_cents: int, currency: str = "usd") -> int:
            key = cached_key("quote", amount_cents)
            hit = get_cached(key)
            if hit is not None:
                return hit
            value = int((amount_cents + fee(amount_cents)) * FX[currency])
            set_cached(key, value)
            return value


        def fee(amount_cents: int) -> int:
            return max(30, amount_cents * 29 // 1000)
    - file: app/cache.py
      before: |
        _store: dict[str, int] = {}


        def cached_key(*parts) -> str:
            return ":".join(str(p) for p in parts)


        def get_cached(key: str):
            return _store.get(key)


        def set_cached(key: str, value: int) -> None:
            _store[key] = value
      after: |
        _store: dict[str, int] = {}


        def cached_key(*parts) -> str:
            """A stable key from any mix of parts; every argument that changes the value belongs in it."""
            return ":".join(str(p) for p in parts)


        def get_cached(key: str):
            return _store.get(key)


        def set_cached(key: str, value: int) -> None:
            _store[key] = value
  expect:
    - file: app/pricing.py
      marker: 'key = cached_key("quote", amount_cents)'
      category: correctness

