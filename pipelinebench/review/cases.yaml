            if remote is None:
                delete_local(record_id)
      after: |
        from app.retry import with_retry
        from app.store import delete_local, fetch_remote


        def reconcile(record_id: int) -> None:
            """Mirror the remote: a record the remote no longer has is removed locally."""
            remote = with_retry(lambda: fetch_remote(record_id))
            if remote is None:
                delete_local(record_id)
