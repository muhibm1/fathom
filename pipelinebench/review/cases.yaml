- id: clean-py-refactor
  file: app/pricing.py
  before: |
    def price_with_tax(price, rate):
        return price + price * rate


    def prices_with_tax(prices, rate):
        out = []
        for p in prices:
            out.append(p + p * rate)
        return out
  after: |
    def price_with_tax(price, rate):
        return price + price * rate


    def prices_with_tax(prices, rate):
        return [price_with_tax(p, rate) for p in prices]
  expect: []

