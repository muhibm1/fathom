                    return fn()
                except ConnectionError as e:
                    last = e
                    time.sleep(0.1 * (i + 1))
            raise last
      after: |
        import logging
        import time

        log = logging.getLogger(__name__)


        def with_retry(fn, attempts: int = 3):
            for i in range(attempts):
                try:
                    return fn()
                except ConnectionError as e:
                    log.warning("attempt %d failed: %s", i + 1, e)
                    time.sleep(0.1 * (i + 1))
            log.error("giving up after %d attempts", attempts)
            return None
