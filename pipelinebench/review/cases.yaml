    def fetch(url: str, timeout_ms: int = 2000) -> bytes:
        """GET ``url``. ``timeout_ms`` is in milliseconds."""
        with urllib.request.urlopen(url, timeout=timeout_ms / 1000) as r:
            return r.read()


    def health(base: str) -> bool:
        return True
  after: |
    import urllib.request


    def fetch(url: str, timeout_ms: int = 2000) -> bytes:
        """GET ``url``. ``timeout_ms`` is in milliseconds."""
        with urllib.request.urlopen(url, timeout=timeout_ms / 1000) as r:
            return r.read()


    def health(base: str) -> bool:
        # the health endpoint is slow on cold start; give it 5 seconds
        return fetch(base + "/health", 5) == b"ok"
  expect:
    - marker: "fetch(base + \"/health\", 5)"
      category: correctness

