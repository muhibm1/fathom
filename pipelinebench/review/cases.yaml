  after: |
    import ast
    import json


    def parse_override(raw: str):
        """Accept JSON or a Python literal (the ops runbook writes tuples and sets)."""
        try:
            return json.loads(raw)
        except json.JSONDecodeError:
            pass
        try:
            return ast.literal_eval(raw)
