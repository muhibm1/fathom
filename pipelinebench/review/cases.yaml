# Stated intent (`intent`): the PR title and body a reviewer would read. An intended,
# announced behaviour change is not a bug; a change the intent does not cover still is.
- id: clean-intent-py-query-spaces-as-plus
  intent: |
    Encode spaces in query strings as '+' instead of '%20'

    Servers we talk to expect application/x-www-form-urlencoded query strings, so
    build_query now uses quote_plus. This changes the wire format on purpose.
  file: app/query.py
  before: |
    from urllib.parse import quote


    def build_query(params: dict[str, str]) -> str:
        return "&".join(f"{quote(k, safe='')}={quote(v, safe='')}" for k, v in params.items())
  after: |
    from urllib.parse import quote_plus


    def build_query(params: dict[str, str]) -> str:
        return "&".join(f"{quote_plus(k, safe='')}={quote_plus(v, safe='')}" for k, v in params.items())
  expect: []

