  before: |
    def invoice_total(lines):
        total = 0
        for line in lines:
            total += line.qty * line.unit_price
        return total
  after: |
    def invoice_total(lines):
        total = 0
        for i in range(1, len(lines)):
            total += lines[i].qty * lines[i].unit_price
        return round(total, 2)
  expect:
    - marker: "range(1, len(lines))"
      category: correctness

