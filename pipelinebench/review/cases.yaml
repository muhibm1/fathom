- id: go-unchecked-error
  file: svc/export.go
  before: |
    func Export(w io.Writer, rows []Row) error {
    	for _, r := range rows {
    		if _, err := fmt.Fprintf(w, "%s,%d\n", r.Name, r.Count); err != nil {
    			return err
    		}
    	}
    	return nil
    }
  after: |
    func Export(w io.Writer, rows []Row) error {
    	for _, r := range rows {
    		fmt.Fprintf(w, "%s,%d\n", r.Name, r.Count)
    	}
    	return nil
    }
  expect:
    - marker: "fmt.Fprintf(w"
      category: correctness

