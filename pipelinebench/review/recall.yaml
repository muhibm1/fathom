  fix: 89599a9541
  fix_title: Fix `verify=False`, `cert=...` case. (#3442)
  bug: verify=False returns before the client certificate is loaded, so cert= is ignored
  expect:
  - path: httpx/_config.py
    line: 28
    end_line: 31
  must_mention:
  - cert
  - client certificate
